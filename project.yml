# XcodeGen definition – `xcodegen generate` creates EishockeyGameCenter.xcodeproj
name: EishockeyGameCenter
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  EishockeyGameCenter:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - Sources
      - Resources
    scheme:
      testTargets:
        - EishockeyGameCenterTests
        - EishockeyGameCenterUITests
    settings:
      base:
        # Placeholder for local builds; CI sets com.<TEAMID>.EishockeyGameCenter or BUNDLE_ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.eishockeygamecenter
        PRODUCT_NAME: EishockeyGameCenter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Eishockey GameCenter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  EishockeyGameCenterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - Tests
    dependencies:
      - target: EishockeyGameCenter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.eishockeygamecenter.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  EishockeyGameCenterUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - UITests
    dependencies:
      - target: EishockeyGameCenter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.eishockeygamecenter.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: EishockeyGameCenter
